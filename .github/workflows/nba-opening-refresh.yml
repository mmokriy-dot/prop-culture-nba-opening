name: Refresh NBA Opening Events
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *' # Daily at 13:30 UTC
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: prop_culture_opening_requirements.txt
      - run: pip install -r prop_culture_opening_requirements.txt
      - run: python prop_culture_opening_refresh.py
      - name: Commit updated CSV snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opening_*.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NBA opening events'
            git push
          fi
